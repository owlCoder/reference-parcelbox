services:
  parcelbox-web:
    build:
      context: .
      dockerfile: src/ParcelBox.Web/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Services__ApiBaseUrl: http://parcelbox-api:8080
      Services__LockerControllerBaseUrl: http://locker-controller:8080
      Services__MessageGatewayBaseUrl: http://message-gateway:8080
    ports:
      - "5200:8080"
    depends_on:
      - parcelbox-api
      - locker-controller
      - message-gateway

  parcelbox-api:
    build:
      context: .
      dockerfile: src/ParcelBox.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ParcelBox: Data Source=/data/parcelbox.db
      ExternalServices__LockerController: http://locker-controller:8080
      ExternalServices__MessageGateway: http://message-gateway:8080
    ports:
      - "5100:8080"
    volumes:
      - parcelbox-data:/data
    depends_on:
      - locker-controller
      - message-gateway

  locker-controller:
    build:
      context: .
      dockerfile: simulators/ParcelBox.Simulators.LockerController/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5101:8080"

  message-gateway:
    build:
      context: .
      dockerfile: simulators/ParcelBox.Simulators.MessageGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5102:8080"

volumes:
  parcelbox-data:
